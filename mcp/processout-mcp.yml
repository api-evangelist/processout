generated: '2026-07-20'
method: searched
status: published
source: https://docs.processout.com/docs/mcp
description: >-
  ProcessOut publishes an official, hosted (remote) Model Context Protocol server
  that gives AI code editors (Cursor, Windsurf) and assistants (Claude Desktop)
  direct access to the ProcessOut API and documentation. A self-hostable server is
  also open-sourced at github.com/processout/processout-mcp for teams that want to
  run it against their own LLM stack with their own credentials.
server:
  name: processout
  transport: http
  url: https://docs.processout.com/mcp
  hosted: true
  auth: >-
    API authentication is passed as headers via the MCP client configuration
    (query parameters or client header config), using ProcessOut project keys.
capabilities:
  - Direct API access to ProcessOut functionality
  - Documentation search
  - Real-time data from the connected ProcessOut account
  - Code-generation assistance for ProcessOut integrations
self_host:
  repo: https://github.com/processout/processout-mcp
  language: javascript
client_config_example:
  mcpServers:
    processout:
      url: https://docs.processout.com/mcp
