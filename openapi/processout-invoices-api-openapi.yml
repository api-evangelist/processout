        description: The invoice ID generated by ProcessOut during the invoice creation
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Source used to capture the payment. Can be a card, a token or a gateway request.
                invoice_detail_ids:
                  type: array
                  description: Array of invoice details created with the invoice to capture.<br>_Only supported on compatible payment providers_
                  items:
                    type: string
                capture_amount:
                  type: string
                  description: Amount to capture partially the transaction
                capture_statement_descriptor:
                  type: string
                  description: Some payment providers are supporting different statement descriptor for the capture. Use this field to send a different one. By default, the one sent during the authorization will be forwarded.
                initial_scheme_transaction_id:
                  type: string
                  description: Override the scheme ID
                split_allocations:
                  type: array
                  items:
                    properties:
                      provider_recipient_reference:
                        type: string
                        description: The unique identifier for the recipient's account. This is the destination account that will receive this portion of the funds.
                      type:
                        type: string
                        description: Defines the purpose of the split. It determines how the funds are categorized and processed.
                        enum:
                        - PURCHASE
                        - VAT
                        - FEE
                        - COMMISSION
                        - MARKETPLACE
                        - SHIPPING
                      amount:
                        type: string
                        description: The specific amount of money for this individual split. Maximum 4 decimal places supported as per ISO 4217.
                      currency:
                        type: string
                        description: Currency for payment of the individual split, in ISO 4217 format (for example, USD). Must be a valid ISO 4217 currency code with 3 characters
                      description:
                        type: string
                        description: A short, human-readable description for this split. This description will appear in transaction reports and can be useful for reconciliation.
                      payment_reference:
                        type: string
                        description: Your own unique reference ID for this specific split. Providing a unique reference is critical for tracking the status of each individual split via webhooks and for reconciling your accounts. Recommended to include.
                    type: object
                    required:
                    - provider_recipient_reference
                    - type
                    - amount
                    - currency
                  description: An array of allocation objects that defines how the capture payment should be divided among different recipients. Each object in this array represents one "split" of the total invoice amount. This object will override the invoice's default split allocations.
                capture_type:
                  type: string
                  description: 'Whether this partial capture is "final" or "non-final". '
