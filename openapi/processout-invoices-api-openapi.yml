                    incremental_authorization:
                      type: boolean
                      description: Ignore incremental authorization requests on PSP that do not support it
                      default: false
                    split_payments:
                      type: boolean
                      description: Ignore split requests on PSP that do not support it
                      default: 'false'
                metadata:
                  type: string
                  description: Custom key/value pair (string/string) metadata that can be used to identify the transaction. This information is passed to upstream payment providers that support similar metadata objects. Do not include personal data in this field.
                  default: '{}'
                  format: json
                gateway_data:
                  type: string
                  description: Used for custom logics / data sent to payment providers.<br>This field <b>is not standard</b> across providers.
                  default: '{}'
                  format: json
                split_allocations:
                  type: array
                  items:
                    properties:
                      provider_recipient_reference:
                        type: string
                        description: The unique identifier for the recipient's account. This is the destination account that will receive this portion of the funds.
                      type:
                        type: string
                        description: Defines the purpose of the split. It determines how the funds are categorized and processed.
                        enum:
                        - PURCHASE
                        - FEE
                        - VAT
                        - COMMISSION
                        - MARKETPLACE
                        - SHIPPING
                      amount:
                        type: string
                        description: The specific amount of money for this individual split. Maximum 4 decimal places supported as per ISO 4217.
                      currency:
                        type: string
                        description: Currency for payment of the individual split, in ISO 4217 format (for example, USD). Must be a valid ISO 4217 currency code with 3 characters
                      description:
                        type: string
                        description: A short, human-readable description for this split. This description will appear in transaction reports and can be useful for reconciliation.
                      payment_reference:
                        type: string
                        description: Your own unique reference ID for this specific split. Providing a unique reference is critical for tracking the status of each individual split via webhooks and for reconciling your accounts. Recommended to include.
                    type: object
                    required:
                    - provider_recipient_reference
                    - type
                    - amount
                    - currency
                  description: An array of allocation objects that defines how a single payment should be divided among different recipients. Each object in this array represents one "split" of the total invoice amount.
