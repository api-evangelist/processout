  /invoices/{invoice_id}/refunds:
    post:
      summary: Refund an invoice
      description: ''
      operationId: refund-an-invoice
      parameters:
      - name: invoice_id
        in: path
        description: The invoice ID generated by ProcessOut during the invoice creation
        schema:
          type: string
        required: true
      - name: Idempotency-Key
        in: header
        description: Unique key to your request that will be used for idempotency
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: string
                  description: Refund amount applied to the transaction.
                reason:
                  type: string
                  description: Reason for the refund (`customer_request`, `duplicate`, `fraud` or `other`).
                  default: other
                metadata:
                  type: object
                  description: Metadata related to the refund, in the form of key-value pairs (string - string).
                  properties: {}
                split_allocations:
                  type: array
                  items:
                    properties:
                      provider_recipient_reference:
                        type: string
                        description: The unique identifier for the recipient's account. This is the destination account that will receive this portion of the funds.
                      type:
                        type: string
                        description: Defines the purpose of the split. It determines how the funds are categorized and processed.
                        enum:
                        - PURCHASE
                        - VAT
                        - FEE
                        - COMMISSION
                        - SHIPPING
                        - MARKETPLACE
                      amount:
                        type: string
                        description: The specific amount of money for this individual split. Maximum 4 decimal places supported as per ISO 4217.
                      currency:
                        type: string
                        description: Currency for payment of the individual split, in ISO 4217 format (for example, USD). Must be a valid ISO 4217 currency code with 3 characters
                      description:
                        type: string
                        description: A short, human-readable description for this split. This description will appear in transaction reports and can be useful for reconciliation.
                      payment_reference:
                        type: string
                        description: Your own unique reference ID for this specific split. Providing a unique reference is critical for tracking the status of each individual split via webhooks and for reconciling your accounts. Recommended to include.
                    type: object
                    required:
                    - provider_recipient_reference
                    - type
                    - amount
                    - currency
                  description: An array of allocation objects that defines how this refund payment should be divided among different recipients. Each object in this array represents one "split" of the total invoice amount. This object will override the invoice's default split allocations.An array of allocation objects that defines how this refund payment should be divided among different recipients. Each object in this array represents one "split" of the total invoice amount. This object will override the invoice's default split allocations.
