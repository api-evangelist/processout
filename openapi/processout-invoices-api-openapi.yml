  /invoices:
    post:
      summary: Create an invoice
      description: ''
      operationId: create-an-invoice
      parameters:
      - name: Idempotency-Key
        in: header
        description: Unique key to your request that will be used for idempotency
        schema:
          type: string
      - in: header
        name: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - amount
              - currency
              properties:
                name:
                  type: string
                  description: Name of the invoice (often an internal ID code from the merchant’s systems).
                amount:
                  type: string
                  description: Amount to be paid. Maximum 4 decimal places supported as per ISO 4217.
                tax:
                  type: object
                  description: Tax information for the invoice.
                  properties:
                    amount:
                      type: string
                      description: Amount is zero or a positive number representing the tax included in the amount.
                    rate:
                      type: string
                      description: Rate is a percentage (0 to 100) representing the rate of tax included in the amount.
                currency:
                  type: string
                  description: Currency for payment of the invoice, in ISO 4217 format (for example, USD). Must be a valid ISO 4217 currency code with 3 characters
                order_id:
                  type: string
                  description: Your unique identifier for the order associated with this invoice. This field is displayed in the Dashboard and ProcessOut uses it to deduplicate invoices and transactions.
                customer_id:
                  type: string
                  description: '**_Resource expandable_**<br>Customer linked to the invoice (generally the one making the purchase).'
                verification:
                  type: boolean
                  description: Tags an invoice to be used as an verification invoice. When this is set to true, we will attempt to automatically utilise the lowest amount applicable for a given PSP & Currency. Otherwise, we will default to utilising the invoice amount provided.
                expires_at:
                  type: string
                  description: Expiry date for the invoice
                  format: date
                auto_capture_at:
                  type: string
                  description: Optional if you want us to auto capture for you. Expected value is a date and time in RFC 3339 format. (UTC only such as "2026-05-11T17:33:00Z". Timezone offset will get stripped)
                  format: date
                details:
                  type: object
                  description: Details of the items or products that are being purchased.
                  required:
                  - name
                  - amount
                  properties:
                    name:
                      type: string
                      description: Name of the item or product, which represents an item on a receipt.<br>_Maximum 80 characters long_
                    amount:
                      type: string
                      description: Amount charged for this item or product.
                    type:
                      type: string
                      description: Item or product type. Set this to anything suitable.<br>_Maximum 30 characters long_
                    quantity:
                      type: integer
                      description: Quantity of the item or product. Default value is 1.
                      format: int32
                      default: ''
                    metadata:
                      type: object
                      description: Metadata related to the invoice detail, in the form of key-value pairs (string - string).
                      properties: {}
                    category:
                      type: string
                      description: Category of the item or product. Can be `food`, `entertainment`, `home`, `appliance`, `bidding`, `gift`, `technology`, `media`, `communication`, `health`, `sport`, `personal-service`, `professional-service`, `clothing`, `travel`, `tickets`, `transport` or `other`.
                    reference:
                      type: string
                      description: Reference of the item or product.<br>_Maximum 255 characters long_
                    description:
                      type: string
                      description: Description of the item or product.<br>_Maximum 255 characters long_
                    brand:
                      type: string
                      description: Brand of the item or product.<br>_Maximum 80 characters long_
                    model:
                      type: string
                      description: Model of the item or product.<br>_Maximum 80 characters long_
                    discount_amount:
                      type: string
                      description: Discount amount (when the discount is listed as a separate item on a receipt).
                    condition:
                      type: string
                      description: Condition of the product. Can be `new`, `refurbished`, `used` or `other`.
                    marketplace_merchant:
                      type: string
                      description: Marketplace merchant ID of the item or product.
                    marketplace_merchant_is_business:
                      type: boolean
                      description: Denotes whether or not the marketplace merchant is a business.
                    marketplace_merchant_created_at:
                      type: string
                      description: Date and time when the merchant was created.<br>_RFC1123 date or timestamp_
                      format: date
                    name1:
                      type: string
                    name2:
                      type: string
                risk:
                  type: object
                  description: Risk assessment for the invoice.
                  properties:
                    score:
                      type: string
                      description: Scoring of the invoice. No validation done on this field because it is used to forward risk information to compatible payment providers.<br>_Maximum 12 characters long_
                    is_legit:
                      type: boolean
                      description: Denotes whether or not the invoice is legitimate.
                    skip_gateway_rules:
                      type: boolean
                      description: Flag to skip payment gateway fraud engine rules. (This is only available on certain compatible gateways. Contact us for more information.)
                device:
                  type: object
                  description: Information about the device and channel used by the customer to initiate the payment.
                  properties:
                    id:
                      type: string
                      description: ID of the device. This can be anything but would usually be a UUID generated by a third-party anti-fraud solution.<br>_Maximum 100 characters long_
                    threeds_sdk:
                      type: string
                      description: "Denotes if using a native experience for 3DS via SDKs e.g. Mobile 3DS SDK, or ProcessOut.JS SDK. If `ios` or `android` is provided, we will assume you can handle 3DS via native mobile SDK implementations. \n\nCan be `web`, `ios` or `android`."
                      default: ''
                    platform:
                      type: string
                      description: 'An informative field denoting the device platform used for the transaction.


                        Can be `web`, `ios`, `android` or `other`.'
                    ip_address:
                      type: string
                      description: IP address of the device.<br>_Must be a valid IP address_
                external_fraud_tools:
                  type: object
                  description: Information to forward to external fraud tools.
                  properties:
                    forter:
                      type: string
                      description: Information for the Forter fraud prevention service.
                      format: json
                    signifyd:
                      type: string
                      description: Information for the Signifyd fraud prevention service.
                      format: json
                    ravelin:
                      type: string
                      description: Information for the Ravelin fraud prevention service.
                      format: json
                shipping:
                  type: object
                  description: Shipping information for the invoice.
                  properties:
                    amount:
                      type: string
                      description: Amount charged for shipping.
                    method:
                      type: string
                      description: Delivery method. Can be `web`, `collect-at-shop`, `relay`, `travel-station`, `home`, `shipping`, `locker` or `other`.
                    provider:
                      type: string
                      description: Delivery provider.<br>_Maximum 32 characters long_
                    delay:
                      type: string
                      description: Shipment delay. Can be `express`, `priority`, `standard` or `other`.
                    address1:
                      type: string
                      description: First line of the delivery address.<br>_Maximum 255 characters long_
                    address2:
                      type: string
                      description: Second line of the delivery address.<br>_Maximum 255 characters long_
                    state:
                      type: string
                      description: State or county of the delivery address.<br>_Maximum 80 characters long_
                    city:
                      type: string
                      description: City of the delivery address.<br>_Maximum 80 characters long_
                    country_code:
                      type: string
                      description: Country code (`US`, `FR`...) of the delivery address.<br>_Must be a valid ISO 3166 country code with 2 characters_
                    zip:
                      type: string
                      description: ZIP code of the delivery address.<br>_Maximum 16 characters long_
                    phone_number:
                      type: object
                      description: Phone number of the shipment recipient
                      properties: {}
                    expects_shipping_at:
                      type: string
                      description: Expected date of delivery.<br>_RFC1123 date or timestamp_
                      format: date
                    relay_store_name:
                      type: string
                      description: Name of the store that the order must be collected from.<br>_Maximum 100 characters long_
                    email:
                      type: string
                      description: Shipping email address.<br>_Must be a valid email_
                    first_name:
                      type: string
                      description: First name of the shipping address.<br>_Maximum 80 characters long. Automatically sanitised on write — emoji, currency symbols, and non-printable characters are stripped, and underscores are converted to spaces. All Unicode scripts are supported._
                    last_name:
                      type: string
                      description: Last name of the shipping address.<br>_Maximum 80 characters long. Automatically sanitised on write — emoji, currency symbols, and non-printable characters are stripped, and underscores are converted to spaces. All Unicode scripts are supported._
                billing:
                  type: object
                  description: Billing information for the invoice. This address will be used to populate the Customer and Card address if empty.
                  properties:
                    address1:
                      type: string
                      description: First line of the billing address.<br/>_Maximum 255 characters long_
                    address2:
                      type: string
                      description: Second line of the billing address.<br/>_Maximum 255 characters long_
                    state:
                      type: string
                      description: State or county of the billing address.<br/>_Maximum 80 characters long_
                    city:
                      type: string
                      description: City of the billing address.<br/>_Maximum 80 characters long_
                    country_code:
                      type: string
                      description: Country code (`US`, `FR`...) of the address.
                    zip:
                      type: string
                      description: ZIP code of the address.<br/>_Maximum 16 characters long_
                statement_descriptor:
                  type: string
                  description: Item that will be listed for this purchase on the customer’s bank statement.<br>_Maximum 25 characters long, should only contain letters, numbers, spaces, dots, asterisks and forward slashes_
                statement_descriptor_phone:
                  type: string
                  description: Support phone number for this purchase on the customer’s bank statement.
                statement_descriptor_city:
                  type: string
                  description: City shown for this purchase on the customer’s bank statement. Maximum 22 characters long. Should only contain letters and numbers.
                statement_descriptor_company:
                  type: string
                  description: Your company name to show on the customer’s bank statement.
                statement_descriptor_url:
                  type: string
                  description: Support URL for this purchase on the customer’s bank statement.
                initiation_type:
                  type: string
                  description: 'Represent the initiation type of the transaction which can be Customer Initiated Transaction (`cit`) or Merchant Initiated Transaction (`mit`).<br>_Allowed values are: `cit` or `mit`_'
                payment_intent:
                  type: string
                  description: 'The type of payment flow that generated the transaction.<br>_Allowed values are: `one-off`, `recurring`, `recurring-standing-order`, `recurring-subscription`, `installment`, `unscheduled`, `unscheduled-delayed-charge`, `unscheduled-resubmission`, `unscheduled-no-show` or `unscheduled-reauthorization`_. <br><br>This field should be used in combination with the `initiation_type` field to tag scenarios such as initial CIT of a recurring sequence.'
                payment_type:
                  type: string
                  description: Optional information about the payment type<br>_Allowed values are “moto” or “ecommerce”_
                return_url:
                  type: string
                  description: For [APMs](../docs/alternative-payment-methods), this is the URL to return to the app after payment is accepted.<br>_Must be a valid URL_
                webhook_url:
                  type: string
                  description: Custom [webhook](/webhooks) URL for this purchase.<br>_Must be a valid URL_
                sca_exemption_reason:
                  type: string
                  description: 'Optional reason for requesting SCA exemption (Note: This must also be supported by the PSP. Please contact us for more information.)<br>_Allowed values are: `low-value`, `trusted-beneficiary` or `transaction-risk-analysis`_'
                challenge_indicator:
                  type: string
                  description: 'Optional challenge indicator field when requesting 3DS2 (Note: This must also be supported by the PSP. Please contact us for more information.)<br>_Allowed values are: `no-preference`, `no-challenge-requested`, `challenge-requested`, `challenge-requested-mandate`, `no-challenge-requested-tra-performed`, `no-challenge-requested-data-share-only`, `no-challenge-requested-sca-performed`, `no-challenge-requested-whitelist-exemption`, `challenge-requested-whitelist-prompt` or `cb-scoring`_'
                unsupported_feature_bypass:
                  type: object
                  description: Bypass payment provider unsupported features set in the transaction
