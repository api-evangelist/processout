                          type: string
                        zip:
                          type: string
                        county:
                          type: string
                    phone_number:
                      type: object
                      properties:
                        dialing_code:
                          type: string
                          description: With or without + prefix
                        number:
                          type: string
                          description: Digits only
                  description: 'All fields are optional. The submerchant data is passed to payment processors that support PayFac/marketplace scenarios for compliance and settlement purposes.

                    Please speak to your Account Manager to confirm this is supported on your Connections.'
