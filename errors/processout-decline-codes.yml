method: searched
source: https://docs.processout.com/docs/error-codes.md
docs: https://docs.processout.com/docs/error-codes
description: ProcessOut normalizes decline reasons from 100+ downstream gateways/PSPs into a single unified error-code taxonomy. Codes are grouped into hard declines (do not retry) and soft declines (may
  be retried). Surfaced on the transaction/invoice object as the error/decline code.
envelope_field: error_code
categories:
- name: hard-decline
  meaning: Terminal decline (fraud, blocked, stolen/lost); do not retry the transaction.
- name: soft-decline
  meaning: Recoverable decline (issuer/network/limit/validation); may be retried, possibly after remediation or authentication.
decline_codes:
