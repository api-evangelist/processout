aid: processout
name: ProcessOut
description: >-
  ProcessOut is a payments technical layer and orchestration platform that
  standardizes how merchants connect to 100+ payment providers (PSPs and alternative
  payment methods). It provides a PCI DSS card vault, tokenization for recurring and
  one-click payments, dynamic no-code checkout, ML-based smart routing to lift
  authorization rates and cut cost, plus analytics and transaction reconciliation.
  The REST API (https://api.processout.com) authenticates with HTTP Basic project
  keys, supports idempotency keys and webhooks, and ships first-party SDKs for
  Node.js, Python, Ruby, PHP and Go plus client-side ProcessOut.js and iOS/Android.
  A hosted MCP server exposes the API and docs to AI agents. Originally a Techstars
  company, ProcessOut is now part of Checkout.com.
